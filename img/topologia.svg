<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Arial, sans-serif" font-size="13">
  <title>Topología de laboratorio en GNS3</title>
  <rect width="640" height="300" fill="#0f2233"/>
  <g stroke="#5fb3d9" stroke-width="2">
    <line x1="320" y1="60" x2="160" y2="140"/>
    <line x1="320" y1="60" x2="480" y2="140"/>
    <line x1="160" y1="140" x2="480" y2="140" stroke-dasharray="6 4"/>
    <line x1="160" y1="140" x2="90" y2="230"/>
    <line x1="160" y1="140" x2="230" y2="230"/>
    <line x1="480" y1="140" x2="410" y2="230"/>
    <line x1="480" y1="140" x2="550" y2="230"/>
  </g>
  <g fill="#1d4e6e" stroke="#9fd8f0" stroke-width="2">
    <circle cx="320" cy="60" r="26"/>
    <circle cx="160" cy="140" r="26"/>
    <circle cx="480" cy="140" r="26"/>
    <rect x="62" y="215" width="56" height="34" rx="4"/>
    <rect x="202" y="215" width="56" height="34" rx="4"/>
    <rect x="382" y="215" width="56" height="34" rx="4"/>
    <rect x="522" y="215" width="56" height="34" rx="4"/>
  </g>
  <g fill="#ffffff" text-anchor="middle">
    <text x="320" y="65">R1</text>
    <text x="160" y="145">R2</text>
    <text x="480" y="145">R3</text>
    <text x="90" y="236">PC1</text>
    <text x="230" y="236">PC2</text>
    <text x="410" y="236">PC3</text>
    <text x="550" y="236">PC4</text>
  </g>
  <g fill="#f5b942" text-anchor="middle" font-size="12">
    <text x="320" y="22">Internet / NAT</text>
    <text x="320" y="132">OSPF Área 0</text>
    <text x="160" y="280">VLAN 10 · 192.168.10.0/24</text>
    <text x="480" y="280">VLAN 20 · 192.168.20.0/24</text>
  </g>
</svg>
